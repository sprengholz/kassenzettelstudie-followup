<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://unpkg.com/survey-core@2.3.14/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.3.14/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.3.14/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.3.14/survey-js-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/survey-core@2.3.14/survey-core.min.css" />
    <link rel="stylesheet" href="./index.css" />
</head>

<body>

    <div id="surveyContainer"
        style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 100%; height:100%"></div>

    <script>



        // Helper: get a query parameter from URL
        function getParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }


        // Load CSV for given user ID
        async function loadCSV(userId) {
            const response = await fetch(`kassenzettel/${userId}.csv`);
            if (!response.ok) throw new Error("Nutzer " + userId + " unbekannt!");
            const text = await response.text();
            return Papa.parse(text, { header: true }).data;
        }


        var condition;
        var total = 0;
        var newtotal = 0;
        var numberOfStrikedProducts = 0;

        function generateFormattedReceipt(items) {

            width_amount = 3;
            width_name = 24;
            width_price = 8;

            lines = [
                "Produkt".padEnd(width_name + width_amount) + "Preis".padStart(width_price),
                "-".repeat(width_name + width_price + width_amount)
            ]

            var total = 0;

            for (item of items) {
                lines.push((item.amount + "x ").substring(0, width_amount) + item.name.substring(0, width_name).padEnd(width_name) + (item.price.toFixed(2) + "").padStart(width_price).replace('.', ','));
                total = total + item.price;
            }

            lines.push("-".repeat(width_name + width_price + width_amount));
            lines.push("<b>" + "Summe".padEnd(width_name + width_amount) + total.toFixed(2).padStart(width_price).replace('.', ',') + "</b>")

            return lines.join("\n");
        }

        function generateRecalculatedReceipt(items) {

            width_amount = 3;
            width_name = 26;
            width_price = 8;
            width_newprice = 8

            lines = [
                "Produkt".padEnd(width_name + width_amount) + "Preis".padStart(width_price) + "Neu".padStart(width_newprice),
                "-".repeat(width_amount + width_name + width_price + width_newprice)
            ]


            let counter = 0;
            for (item of items) {

                counter++;

                let color = "##f8f8f8";
                let bgcolor = "#white";
                let fontweight = "normal";
                if (item.newprice > item.price) {
                    color = "#ED3F27";
                    bgcolor = "#FFC4C4";
                    fontweight = "bold";
                } else if (item.newprice < item.price) {
                    color = "#3A6F43";
                    bgcolor = "#B4DEBD";
                    fontweight = "bold";
                }

                lines.push(`<product no="${counter}" name="${item.name}"><span style="background-color:${bgcolor}; border-radius: 3px;"><span style="font-family: Ubuntu Mono, monospace; font-size: 14px; text-decoration-thickness: 3px;">` + (item.amount + "x ").substring(0, width_amount) + item.name.substring(0, width_name).padEnd(width_name) + (item.price.toFixed(2) + "").padStart(width_price).replace('.', ',') + `</span><span style='color:${color}; font-family: Ubuntu Mono, monospace; font-size: 14px; white-space: pre; text-decoration-thickness: 3px; font-weight: ${fontweight}; border-radius: 3px;'>` + (item.newprice.toFixed(2) + "").padStart(width_newprice).replace('.', ',') + "</span></span></product>");
                total = total + item.price;
                newtotal = newtotal + item.newprice;
            }

            newtotal = Math.round(newtotal * 100) / 100;

            let color = "black";
            if (newtotal > total) {
                color = "red";
            } else if (newtotal < total) {
                color = "green";
            }

            lines.push("-".repeat(width_name + width_price + width_newprice + width_amount));
            lines.push("<span id = 'sumline' style = 'font-family: Ubuntu Mono, monospace; font-size: 14px; font-weight: bold;'>" + "Summe".padEnd(width_name + width_amount) + total.toFixed(2).padStart(width_price).replace('.', ',') + `</span><span id='sumline-extension' style='color:${color}; font-family: Ubuntu Mono, monospace; font-size: 14px; font-weight: bold; white-space: pre; font-weight: bold;'>` + newtotal.toFixed(2).padStart(width_newprice).replace('.', ',') + "</span></b>")

            return lines.join("\n");
        }


        async function initSurvey() {

            const userId = getParam("id");
            if (!userId) {
                document.body.innerHTML = "<h3>❌ Fehlender URL-Parameter!</h3>";
                return;
            }

            try {

                // randomly assign to one of two conditions and store in survey
                var condition = Math.random();
                var condition_description = "";
                if (condition <= 0.3333) {
                    condition = "increase";
                    condition_description = "Erhöhung der Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier auf 19%, unveränderte Steuer auf Obst, Gemüse, Hülsenfrüchte und Nüsse von 7%";
                } else if (condition <= 0.6667) {
                    condition = "decrease";
                    condition_description = "unveränderte Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier von 7%, Senkung der Steuer auf Obst, Gemüse, Hülsenfrüchte und Nüsse auf 0%";
                } else {
                    condition = "combo";
                    condition_description = "Erhöhung der Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier auf 19%, Senkung der Steuer auf Obst, Gemüse, Hülsenfrüchte und Nüsse auf 0%";
                }

                // load receipt and create choices array
                const receipt = await loadCSV(userId);
                const productlist = receipt.map(p => {

                    const name = p.NAME;
                    const amount = parseInt(p.AMOUNT);
                    const singleprice = parseFloat(p.PRICE.replace(',', '.'));
                    const price = amount * singleprice;
                    const tax = parseFloat(p.TAX) / 100;
                    const category = p.CATEGORY;
                    var newprice;

                    if ((condition == "increase" || condition == "combo") && category == "MD") {
                        newprice = (price / (1 + tax)) * 1.19;
                    } else if ((condition == "decrease" || condition == "combo") && category == "FV") {
                        newprice = (price / (1 + tax));
                    } else {
                        newprice = price;
                    }
                    newprice = Math.round(newprice * 100) / 100; // cut new prices to two decimals

                    return {
                        name: name,
                        amount: amount,
                        singleprice: singleprice,
                        price: price,
                        tax: tax,
                        newprice: newprice
                    }

                });

                const formattedreceipt = generateFormattedReceipt(productlist);
                const recalculatedreceipt = generateRecalculatedReceipt(productlist);

                // define SurveyJS model
                const surveyJson = {
                    showPrevButton: false,
                    locale: "de",
                    completedHtml: "<img src='animation.gif' style='width: 100px;'/><p>Vielen Dank. Ihre Antworten werden übertragen, anschließend werden Sie automatisch zu Prolific zurückgeleitet. Bitte warten...</p>",
                    pages: [
                        {
                            name: "consent",

                            elements: [
                                {
                                    "type": "html",
                                    "name": "briefing",
                                    "html": "<h3>Herzlich willkommen!</h3><p>Schön, dass Sie wieder an einer Umfrage der Universität Bamberg teilnehmen. Sie haben uns vor einigen Wochen einen Kassenzettel geschickt. In dieser Umfrage möchten wir nun Ihre Meinung zu einer möglichen Veränderung der Mehrwertsteuer auf Lebensmittel erfassen. Die Teilnahme wird rund 5 Minuten dauern, ist freiwillig und kann jederzeit abgebrochen werden.</p><p>Ihre Angaben werden für wissenschaftliche Zwecke erhoben und können in anonymisierter Form dauerhaft in einem öffentlichen Repositorium abgelegt werden. Ein Rückschluss auf Ihre Person ist dabei keinesfalls möglich. Weitere Informationen zur Datenverarbeitung finden Sie <a href='https://www.uni-bamberg.de/datenschutz/datenschutzinformationen/allgemeine-inhalte-datenschutzinformationen/', target='_blank'>hier</a>. Sie können Ihre Zustimmung zur Datenverarbeitung jederzeit per Email an philipp.sprengholz@uni-bamberg.de widerrufen.</p>",
                                    "startWithNewLine": false
                                },
                                {

                                    "type": "boolean",
                                    "name": "consent",
                                    "title": "**Einwilligungserklärung**",
                                    "labelTrue": "**Ja, ich möchte an der Umfrage teilnehmen** und willige in die Verarbeitung meiner Daten zum Zweck der wissenschaftlichen Forschung ein.",
                                    "labelFalse": "**Nein, ich möchte nicht an der Umfrage teilnehmen.**",
                                    "renderAs": "radio",
                                    "isRequired": true,
                                    "swapOrder": true
                                }
                            ]

                        },
                        {
                            elements: [
                                {
                                    "type": "html",
                                    "name": "policy-ratingintro",
                                    "html": "<b>Bitte stellen Sie sich folgendes vor:</b>",
                                    "startWithNewLine": true
                                },
                                {

                                    "type": "panel",


                                    "elements": [
                                        {
                                            "type": "html",
                                            "name": "policy-intro",
                                            "html": "<p><b>Die Bundesregierung diskutiert darüber, die Steuersätze für Nahrungsmittel zu ändern.</b></p><p>Momentan werden viele pflanzenbasierten Lebensmittel wie Obst, Gemüse, Hülsenfrüchte und Nüsse aber auch tierische Lebensmittel wie Fleisch und Wurst, Fisch, Milchprodukte und Eier mit einem verminderten Mehrwertsteuersatz von 7% besteuert anstatt mit dem regulären Mehrwertsteuersatz von 19%.</p>",
                                            "startWithNewLine": false
                                        },
                                        {
                                            "type": "html",
                                            "name": "policy-increase",
                                            "html": "<b>Die Steueränderung sieht folgendes vor:<ul><li>Die Steuer Obst, Gemüse, Hülsenfrüchte und Nüsse soll bei 7% bleiben.</li><li>Die Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier soll von 7% auf 19% erhöht werden.</li></ul></b>",
                                            "startWithNewLine": true,
                                            "visibleIf": "{condition} = increase"
                                        },
                                        {
                                            "type": "html",
                                            "name": "policy-decrease",
                                            "html": "<b>Die Steueränderung sieht folgendes vor:<ul><li>Die Steuer auf Obst, Gemüse, Hülsenfrüchte und Nüsse soll von 7% auf 0% gesenkt werden.</li><li>Die Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier soll bei 7% bleiben.</li></ul></b>",
                                            "startWithNewLine": true,
                                            "visibleIf": "{condition} = 'decrease'"
                                        },
                                        {
                                            "type": "html",
                                            "name": "policy-combo",
                                            "html": "<b>Die Steueränderung sieht folgendes vor:<ul><li>Die Steuer auf Obst, Gemüse, Hülsenfrüchte und Nüsse soll von 7% auf 0% gesenkt werden.</li><li>Die Steuer auf Fleisch und Wurst, Fisch, Milchprodukte und Eier soll von 7% auf 19% erhöht werden.</li></ul></b>",
                                            "startWithNewLine": true,
                                            "visibleIf": "{condition} = 'combo'"
                                        }]
                                },
                                {
                                    "type": "panel",
                                    "title": "**Wie sehr stimmen Sie folgenden Aussagen zu?**",
                                    elements: [
                                        {
                                            "type": "rating",
                                            "name": "agreement_1",
                                            "title": "**Ich befürworte die Steueränderung.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        },
                                        {
                                            "type": "rating",
                                            "name": "reactance_1",
                                            "title": "**Ich ärgere mich über die Steueränderung.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        },
                                        {
                                            "type": "rating",
                                            "name": "pbconsumption_1",
                                            "title": "**Wenn die Steueränderung umgesetzt würde, dann würde ich mehr Obst, Gemüse, Hülsenfrüchte und Nüsse essen.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        },
                                        {
                                            "type": "rating",
                                            "name": "apconsumption_1",
                                            "title": "**Wenn die Steueränderung umgesetzt würde, dann würde ich weniger Fleisch und Wurst, Fisch, Milchprodukte und Eier essen.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        }
                                    ]


                                }


                            ]
                        },
                        {
                            name: "guess",
                            elements: [
                                {
                                    "type": "html",
                                    "name": "receipt-esrtimate-intro",
                                    "html": "<b>Sie haben uns vor einigen Wochen im Rahmen einer anderen Umfrage das Bild eines Kassenzettels geschickt. Hier haben wir diesen Einkauf noch einmal zusammengefasst:</b><br><div class='receiptcontainer'><div class='receipt' id='receipt''>" + formattedreceipt + "</div></div>",
                                    "startWithNewLine": false
                                },
                                {
                                    "name": "receipt-estimate",
                                    "type": "text",
                                    "title": "**Bitte schätzen Sie nun ein, wie viel Ihr Einkauf kosten würde, wenn die vorgestellte Steueränderung umgesetzt wird** (" + condition_description + "):",
                                    "description": "Geben Sie eine Summe in Euro ein. Sie können den Betrag auf Cents genau angeben.",
                                    "min": 0,
                                    "max": 1000,
                                    "isRequired": true,
                                    "maskType": "currency",
                                    "maskSettings": {
                                        "suffix": " €",
                                        "decimalSeparator": ",",
                                        "thousandsSeparator": "."
                                    }
                                }
                            ]
                        },
                        {
                            name: "recalculation",
                            elements: [
                                {
                                    "type": "html",
                                    "name": "receipt-recalculation-intro",
                                    "html": "<p>Sie haben geschätzt, dass Ihr Einkauf durch die Steueränderung <b>{receipt-estimate}</b> kosten würde. Tatsächlich würde der Einkauf durch die Steueränderung <b>" + newtotal.toFixed(2).replace('.', ',') + " €</b> kosten.</p><p>Im Folgenden sehen Sie, wie sich die Steuerveränderung auf einzelne Lebensmittel auswirkt. Lebensmittel sind <span style='color:#ED3F27; font-weight:bold;'>rot</span> hervorgehoben, wenn sich ihr Preis durch die Steueränderung erhöht und <span style='color:#3A6F43; font-weight:bold;'>grün</span>, wenn er sich verringert.</p>",
                                    "startWithNewLine": false
                                },
                                {
                                    "type": "html",
                                    "name": "receipt-recalculation",
                                    "html": "<div class='receiptcontainer'><div class='receipt'>" + recalculatedreceipt + "</div></div>",
                                    "startWithNewLine": true
                                },
                                {

                                    "type": "panel",
                                    "title": "**Nun möchten wir Sie noch einmal nach Ihrer Meinung zur Steueränderung befragen** (" + condition_description + "). **Wie sehr stimmen Sie folgenden Aussage zu?**",

                                    "elements": [
                                        {
                                            "type": "rating",
                                            "name": "agreement_2",
                                            "title": "**Ich befürworte die Steueränderung.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        },
                                        {
                                            "type": "rating",
                                            "name": "reactance_2",
                                            "title": "**Ich ärgere mich über die Steueränderung.**",
                                            "minRateDescription": "stimme überhaupt nicht zu",
                                            "maxRateDescription": "stimme voll und ganz zu",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                        },
                                    ]


                                }
                            ]
                        },
                        {
                            name: "strike",
                            elements: [
                                {
                                    "type": "html",
                                    "name": "receipt-strike-intro",
                                    "html": "<p>Bitte stellen Sie sich vor, die Steueränderung wurde umgesetzt. Würden Sie Ihren Einkauf in diesem Fall noch einmal genauso durchführen oder einige Produkte streichen?</p><p><b>Bitte klicken Sie auf die Produkte, die sie nicht noch einmal einkaufen würden wenn der neue Preis gelten würde.</b></p><p>Wenn Sie nichts streichen und alles noch einmal genauso kaufen würden, geben Sie dies bitte unten an.</p>",
                                    "startWithNewLine": false
                                },
                                {
                                    "type": "html",
                                    "name": "receipt-strike",
                                    "html": "<div class='receiptcontainer'><div class='receipt'>" + recalculatedreceipt + "</div></div",
                                    "startWithNewLine": true
                                },
                                {
                                    "type": "boolean",
                                    "name": "nostrike",
                                    "title": "**Ich möchte keine Produkte streichen** und würde den Einkauf noch einmal genauso durchführen.",
                                    "useTitleAsLabel": true,
                                    "renderAs": "checkbox"
                                }
                            ]
                        },
                        {
                            name: "other",
                            elements: [
                                {
                                 "type": "panel",
                                 "title": "**Abschließend geht es um die Auswirkungen der vorgestellten Steueränderung** ("+condition_description+").",
                                    "elements" : [
                           
                                {
                                            "type": "rating",
                                            "name": "effect_environment",
                                            "title": "**Wie stark fördert die Steueränderung Ihrer Meinung nach den Klima- und Umweltschutz?**",
                                            "minRateDescription": "überhaupt nicht",
                                            "maxRateDescription": "sehr",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                },
                                 {
                                            "type": "rating",
                                            "name": "effect_health",
                                            "title": "**Wie stark fördert die Steueränderung Ihrer Meinung nach die Gesundheit der Menschen in Deutschland?**",
                                            "minRateDescription": "überhaupt nicht",
                                            "maxRateDescription": "sehr",
                                            "rateMin": 1,
                                            "rateMax": 7,
                                            "isRequired": true
                                }]},
                                  {
                                 "type": "panel",
                                 "title": "**Nun haben wir noch 2 Fragen zu Ihrer Person.**",
                                    "elements" : [
                                {
                                    "type": "boolean",
                                    "name": "meat",
                                    "title": "**Essen Sie aktuell Fleisch, Wurst und/oder Fisch?**",
                                    "valueTrue": "Ja",
                                    "valueFalse": "Nein",
                                    "renderAs": "radio",
                                    "swapOrder": true,
                                    "isRequired": true
                                },
                                 {
                                    "type": "boolean",
                                    "name": "dairyeaggs",
                                    "title": "**Essen Sie aktuell Milchprodukte und/oder Eier?**",
                                    "valueTrue": "Ja",
                                    "valueFalse": "Nein",
                                    "renderAs": "radio",
                                    "swapOrder": true,
                                    "isRequired": true
                                }]}
                            ]
                        },
                    ]
                };

                const survey = new Survey.Model(surveyJson);

                survey.setValue("userId", userId);
                survey.setValue("condition", condition);

                const converter = markdownit({
                    html: true // Support HTML tags in the source (unsafe, see documentation)
                });
                survey.onTextMarkdown.add((_, options) => {
                    // Convert Markdown to HTML
                    let str = converter.renderInline(options.text);
                    // ...
                    // Sanitize the HTML markup using a third-party library here
                    // ...
                    // Set HTML markup to render
                    options.html = str;
                });

                survey.onValidateQuestion.add(function (sender, options) {
                    if (options.name === "consent" && options.value === false) {
                        options.error = "Eine Teilnahme an der Umfrage erfordert Ihre Einwilligung.";
                    }

                    if (options.name === "nostrike") {
                        
                        if (((options.value === undefined) || (options.value === false)) && (numberOfStrikedProducts == 0)){
                            options.error = "Sie haben keine Produkte gestrichen. Wenn Sie keine Produkte streichen wollen, setzen Sie hier bitte einen Haken.";
                        }

                        if ((options.value === true) && (numberOfStrikedProducts > 0)){
                            options.error = "Sie haben Produkte gestrichen. Bitte entfernen Sie hier den Haken.";
                        }

                        
                    }

                });

                survey.onAfterRenderQuestion.add(function (survey, options) {
                    if (options.question.name === "receipt-strike") {
                        const items = options.htmlElement.querySelectorAll("product");


                        items.forEach((item) => {
                            item.style.cursor = "pointer";
                            item.addEventListener("click", function () {
                                item.classList.toggle("striked");
                                if (item.classList.contains("striked")) {
                                    item.style.textDecorationLine = "line-through";
                                    item.style.textDecorationColor = "black";
                                    item.style.textDecorationThickness = "3px";
                                } else {
                                    item.style.textDecoration = "none";
                                }

                                // Collect striked items and store in survey data
                                const selected = Array.from(items)
                                    .filter((product) => product.classList.contains("striked"))
                                    .map((product) => ({
                                        no: product.getAttribute("no"),
                                        name: product.getAttribute("name")

                                    }));
                                survey.setValue("strikedProducts", selected);
                                numberOfStrikedProducts = selected.length;

                                // Update totals
                                const remainingProductIndexes = Array.from(items)
                                    .filter(product => !product.classList.contains("striked"))
                                    .map(product => Number(product.getAttribute("no")) - 1);

                                console.log(remainingProductIndexes);


                                const total_unstriked = productlist.filter((_, index) => remainingProductIndexes.includes(index)).reduce((sum, item) => sum + item.price, 0);
                                const newtotal_unstriked = productlist.filter((_, index) => remainingProductIndexes.includes(index)).reduce((sum, item) => sum + item.newprice, 0);

                                let color_unstriked = "black";
                                if (newtotal_unstriked > total_unstriked) {
                                    color_unstriked = "red";
                                } else if (newtotal_unstriked < total_unstriked) {
                                    color_unstriked = "green";
                                }

                                sumline = document.getElementById("sumline");
                                sumline_extension = document.getElementById("sumline-extension");
                                sumline.innerHTML = "Summe".padEnd(26 + 3) + total_unstriked.toFixed(2).padStart(8).replace('.', ',');
                                sumline_extension.innerHTML = newtotal_unstriked.toFixed(2).padStart(8).replace('.', ',');
                                sumline_extension.style.color = color_unstriked;

                                // Store values
                                survey.setValue("total_originaltax_all", total);
                                survey.setValue("total_newtax_all", newtotal);
                                survey.setValue("total_originaltax_unstriked", total_unstriked);
                                survey.setValue("total_newtax_unstriked", newtotal_unstriked);
                            });
                        });
                    }
                });


                survey.applyTheme(SurveyTheme.Default);


                async function fetchWithRetry(url, options = {}, retries = 3, delay = 500) {
                    try {
                        const response = await fetch(url, options);

                        // When using no-cors, we can't inspect the result. Assume success.
                        if (options.mode === "no-cors") return response;

                        if (!response.ok) throw new Error(`HTTP error ${response.status}`);

                        return response;
                    } catch (error) {
                        if (retries === 0) {
                            console.error(`❌ Request failed after retries:`, error);
                            throw error;
                        }

                        console.warn(`⚠️ Retry in ${delay}ms... (${retries} left)`);

                        await new Promise(res => setTimeout(res, delay));

                        return fetchWithRetry(url, options, retries - 1, delay * 2);
                    }
                }

                async function saveResults(results) {

                    console.log("Started data transfer...");

                    // Save to Google Sheets
                    await fetchWithRetry(
                        "https://script.google.com/macros/s/AKfycbyfqlYEw7No252VEQfEx0Za63kVrP0NWuye8FAOvtPHe_sP5LuRc0c6Rx1xP2D_R2XC/exec",
                        {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(results)
                        }
                    );
                    console.log("✔ Sheets done");

                    // Save to JSONBin
                    const res = await fetchWithRetry(
                        "https://api.jsonbin.io/v3/b",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "X-Access-Key": "$2a$10$m76QOoR/sfsnVPnjwZFPauY0k3U0p7RqUPwP28cRD0CdNV9JYiT5O",
                                "X-Collection-Id": "691b83e043b1c97be9b3d102"
                            },
                            body: JSON.stringify(results)
                        }
                    );
                    console.log("✔ JSONBin done");

                    window.location.href = "https://www.prolific.com/";

                }

                survey.onComplete.add((sender, options) => {

                    const results = sender.data;
                    saveResults(results);

                });
                survey.render(document.getElementById("surveyContainer"));
            } catch (e) {
                document.body.innerHTML = `<h3>❌ ${e.message}</h3>`;
            }
        }

        initSurvey();




    </script>
